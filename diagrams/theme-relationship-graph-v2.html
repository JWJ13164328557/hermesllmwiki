<!DOCTYPE html>
<html><head><meta charset="utf-8">
<title>知识库 8大主题关系图谱</title>
<script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
</head><body>
<div id="graph" style="width:100%;height:950px"></div>
<script>
const themes = [{"id": "#single-cell-spatial", "name": "\u5355\u7ec6\u80de\u4e0e\u7a7a\u95f4\u7ec4\u5b66", "color": "#3498DB", "count": 288}, {"id": "#developmental-biology", "name": "\u53d1\u80b2\u751f\u7269\u5b66", "color": "#27AE60", "count": 216}, {"id": "#metabolism-np", "name": "\u4ee3\u8c22\u4e0e\u5929\u7136\u4ea7\u7269", "color": "#8E44AD", "count": 265}, {"id": "#hormone-signaling", "name": "\u6fc0\u7d20\u4e0e\u4fe1\u53f7\u8f6c\u5bfc", "color": "#E67E22", "count": 59}, {"id": "#stress-immunity", "name": "\u80c1\u8feb\u4e0e\u514d\u75ab", "color": "#E74C3C", "count": 91}, {"id": "#epigenetics-gr", "name": "\u8868\u89c2\u4e0e\u57fa\u56e0\u8c03\u63a7", "color": "#E17055", "count": 79}, {"id": "#methods-tools", "name": "\u65b9\u6cd5\u4e0e\u5de5\u5177", "color": "#1ABC9C", "count": 89}, {"id": "#genomics-evolution", "name": "\u57fa\u56e0\u7ec4\u4e0e\u8fdb\u5316", "color": "#F39C12", "count": 79}];
const edges = [["#genomics-evolution", "#metabolism-np", 40], ["#developmental-biology", "#metabolism-np", 17], ["#epigenetics-gr", "#metabolism-np", 27], ["#metabolism-np", "#stress-immunity", 37], ["#epigenetics-gr", "#single-cell-spatial", 27], ["#developmental-biology", "#epigenetics-gr", 25], ["#epigenetics-gr", "#genomics-evolution", 13], ["#metabolism-np", "#single-cell-spatial", 22], ["#developmental-biology", "#single-cell-spatial", 44], ["#genomics-evolution", "#single-cell-spatial", 57], ["#single-cell-spatial", "#stress-immunity", 23], ["#developmental-biology", "#hormone-signaling", 21], ["#developmental-biology", "#stress-immunity", 11], ["#methods-tools", "#single-cell-spatial", 40], ["#developmental-biology", "#genomics-evolution", 17], ["#genomics-evolution", "#hormone-signaling", 5], ["#metabolism-np", "#methods-tools", 5], ["#genomics-evolution", "#methods-tools", 27], ["#epigenetics-gr", "#hormone-signaling", 7], ["#hormone-signaling", "#metabolism-np", 16], ["#epigenetics-gr", "#stress-immunity", 21], ["#hormone-signaling", "#stress-immunity", 6], ["#hormone-signaling", "#single-cell-spatial", 7], ["#genomics-evolution", "#stress-immunity", 5], ["#developmental-biology", "#methods-tools", 3], ["#epigenetics-gr", "#methods-tools", 5]];

const n = themes.length;
const radius = 1.3;
const xs = [], ys = [], texts = [], sizes = [], colors = [];

// Custom circular layout with adjustments to reduce overlap
const offsets = [0, 0, 0, 0.12, -0.12, 0.08, -0.08, 0]; // radial offsets
for (let i = 0; i < n; i++) {
    const angle = (2 * Math.PI * i / n) - Math.PI / 2;
    const r = radius + offsets[i];
    xs.push(r * Math.cos(angle));
    ys.push(r * Math.sin(angle));
    texts.push(themes[i].name + '<br>(' + themes[i].count + '篇)');
    sizes.push(Math.max(30, Math.sqrt(themes[i].count) * 3.5));
    colors.push(themes[i].color);
}

// Edge traces with width proportional to count
const edge_traces = [];
const maxW = Math.max(...edges.map(e => e[2]));
edges.forEach(([t1, t2, weight]) => {
    const i1 = themes.findIndex(t => t.id === t1);
    const i2 = themes.findIndex(t => t.id === t2);
    if (i1 < 0 || i2 < 0) return;
    const w = 1 + (weight / maxW) * 5;
    edge_traces.push({
        x: [xs[i1], xs[i2], null],
        y: [ys[i1], ys[i2], null],
        mode: 'lines',
        line: {width: w, color: 'rgba(150,150,150,' + (0.3 + weight/maxW*0.5) + ')'},
        hoverinfo: 'text',
        hovertext: themes[i1].name + ' ↔ ' + themes[i2].name + ': ' + weight + '篇交叉',
        type: 'scatter'
    });
});

const node_trace = {
    x: xs, y: ys,
    mode: 'markers+text',
    text: texts,
    textposition: 'top center',
    textfont: {size: 12, family: 'Noto Sans SC, sans-serif'},
    marker: {
        size: sizes,
        color: colors,
        line: {width: 2, color: '#333'},
        opacity: 0.9
    },
    hovertemplate: '%{text}<extra></extra>',
    type: 'scatter'
};

const layout = {
    title: {text: '植物学知识库 — 8大主题关系图谱<br><sub>节点大小=文献数 | 连线粗细=关键词交叉强度 | 2026-06-01</sub>', font: {size: 18}},
    showlegend: false,
    xaxis: {showgrid: false, zeroline: false, showticklabels: false, range: [-2, 2]},
    yaxis: {showgrid: false, zeroline: false, showticklabels: false, range: [-2, 2]},
    width: 1000, height: 950,
    margin: {l: 20, r: 20, t: 80, b: 20}
};

Plotly.newPlot('graph', [...edge_traces, node_trace], layout);
</script>
</body></html>
